# Local Supabase project config skeleton (PG-001).
# No schema, RLS policies, or Edge Functions exist yet — see
# migrations/ and PRO_GRAFIZ_MASTER_SPEC.md Section 7 for what's coming
# in PG-003/PG-005.
#
# This file was authored without running `supabase init` (no network/
# CLI access in the authoring environment). Regenerate or reconcile
# against `supabase init` output once the Supabase CLI is available,
# rather than trusting these defaults blindly.

project_id = "pro-grafiz"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Buckets are created via migration, not here, once PG-003/PG-011 define
# the private storage layout (previews vs. production DXF vs. documents).

[auth]
enabled = true
# PG-004 decision: staff PINs ARE their Supabase Auth password (see
# 20260904000013_staff_authentication.sql). This requires a shorter
# minimum than Supabase's usual default (6) — 4 digits, matching the
# approved design's PIN field exactly. Do not raise this without also
# reworking the staff auth design; do not lower it further, 4 is
# already the approved minimum.
minimum_password_length = 4

[auth.sms]
enabled = true
# Customer sign-in is phone OTP (see
# 20260904000014_customer_authentication.sql). No provider is
# configured here — Supabase requires a real SMS provider (Twilio,
# MessageBird, Termii, etc.) with real API credentials, which this
# environment has no way to create or verify (see .env.example and the
# "prohibited actions" around creating accounts / entering credentials).
# Configure a provider and its secrets directly in the Supabase project
# dashboard or via `supabase secrets set` before phone auth will
# actually send an OTP anywhere. "twilio" below is only an example value
# to keep this file valid TOML — no SMS vendor has actually been chosen;
# that's a commercial decision for the product owner, not made here.
provider = "twilio"
