name: Build staging APK

# Builds the Pro_Grafiz Android app against STAGING on GitHub's servers
# and saves the APK as a downloadable artifact. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK (staging)
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add STAGING_SUPABASE_URL and STAGING_SUPABASE_ANON_KEY repository secrets first."
            exit 1
          fi
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # Private to repository collaborators. Contains the staging anon key,
      # so never post this file publicly.
      - uses: actions/upload-artifact@v4
        with:
          name: pro-grafiz-staging-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7