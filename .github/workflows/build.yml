name: Build

on:
  pull_request:
  push:
    branches: [main]

# No deploy step and no production credentials are configured in this
# workflow. Release pipelines (Android/iOS signing, web hosting deploy)
# are added later, once environments exist (see docs/deployment.md) —
# do not add secrets or deploy steps here without an explicit change.

jobs:
  build-admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm install
      - run: npm run build

  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug
